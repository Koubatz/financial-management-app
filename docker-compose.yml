services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: monorepo-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: monorepo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET not set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    container_name: monorepo-web
    ports:
      - '5173:80'
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api:3000
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: monorepo-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monorepo
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
