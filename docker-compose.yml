services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: monorepo-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: monorepo-web
    ports:
      - '5173:80'
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: monorepo-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monorepo
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
