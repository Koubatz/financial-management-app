name: CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm i
      - run: pnpm lint
      - run: pnpm build

      - name: Create Pull Request
        if: ${{ success() && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'Automated commit from CI'
          title: 'Automated PR from CI'
          body: 'This PR was created automatically after successful CI checks.'
          branch: ${{ github.ref_name }}
          base: main
          token: ${{ github.token }}
