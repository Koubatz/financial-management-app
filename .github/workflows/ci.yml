name: CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm i
      - run: pnpm lint
      - run: pnpm build

      - name: Create Pull Request
        if: ${{ success() && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Check if an open PR from this branch to main already exists
          if ! gh pr list --repo "$REPO" --state open --base main --head "$BRANCH" --json number --jq 'length>0'; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "Automated PR from CI" \
              --body "This PR was created automatically after successful CI checks."
          fi
