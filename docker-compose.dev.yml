x-common-env: &common-env
  NODE_ENV: development
  # Melhor detecção de mudanças em ambientes Docker Desktop/Windows/macOS:
  CHOKIDAR_USEPOLLING: 'true'
  WATCHPACK_POLLING: 'true'
  # Opcional: acelera HMR em bind mounts mais lentos
  VITE_FORCE_HMR: 'true'

x-common-volumes: &common-volumes
  - ./:/workspace:delegated
  - pnpm-store:/root/.local/share/pnpm/store
  - node_modules:/workspace/node_modules
  - api-node_modules:/workspace/apps/api/node_modules
  - web-node_modules:/workspace/apps/web/node_modules
  - utils-node_modules:/workspace/packages/utils/node_modules

services:
  api:
    container_name: monorepo-api-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    environment:
      <<: *common-env
      PORT: '3000'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: monorepo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      JWT_SECRET: 'dev-secret-key-change-in-production'
      JWT_EXPIRES_IN: '7d'
    command: >
      sh -lc "
        pnpm install --frozen-lockfile=false &&
        pnpm --filter api dev
      "
    ports:
      - '3000:3000'
    volumes: *common-volumes
    depends_on:
      - db

  web:
    container_name: monorepo-web-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    environment:
      <<: *common-env
      VITE_PORT: '5173'
      VITE_API_URL: http://localhost:3000
    command: >
      sh -lc "
        pnpm install --frozen-lockfile=false &&
        pnpm --filter web dev -- --host
      "
    ports:
      - '5173:5173' # Vite dev server
      - '24678:24678' # (fallback) porta HMR em algumas configs
    volumes: *common-volumes
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: monorepo-db-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monorepo
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  pnpm-store:
  node_modules:
  api-node_modules:
  web-node_modules:
  utils-node_modules:
  db-data:
